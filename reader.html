<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>りんごちゃん | ビューア</title><link rel="stylesheet" href="assets/style.css"></head><body class="reader-page"><header class="reader-bar"><div class="reader-bar-inner"><div class="reader-title"><a id="context-back" href="index.html">← 作品トップへ</a> <span id="reader-title"></span></div><div class="reader-controls"><button class="small-btn" id="top" type="button">先頭へ</button></div></div></header><main class="viewer" id="viewer"></main><div class="page-nav"><button id="prev" type="button">← 次のページ</button><button id="next" type="button">前のページ →</button></div><div class="counter" id="counter"></div><div class="reader-footer"><a href="index.html">作品トップへ戻る</a></div><script>const mode=new URLSearchParams(location.search).get('mode')||'volume';const ranges={volume:[1,24,'第1巻'],episode1:[3,16,'第1話 りんごちゃん1世'],episode2:[17,24,'第2話 生きろ！！']};const [first,last,title]=ranges[mode]||ranges.volume;const viewer=document.getElementById('viewer');viewer.dataset.volumeReader=String(mode==='volume');document.getElementById('reader-title').textContent=title;for(let n=first;n<=last;n++){const page=document.createElement('div');page.className='manga-page';const img=document.createElement('img');img.src='images/pages/'+String(n).padStart(3,'0')+'.webp';img.alt=title+' ページ'+(n-first+1);if(n>first+2)img.loading='lazy';page.append(img);viewer.append(page)}</script><script src="assets/reader.js"></script></body></html>
